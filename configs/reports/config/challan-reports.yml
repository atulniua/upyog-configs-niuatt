---
ReportDefinitions:        
  - reportName: Categorywisechallanreport
    decryptionPathId: CHALLANREPORTS
    summary: Challan wise detail report per tenant according to status
    version: 1.0.0
    moduleName: rainmaker-ch
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: challanno
        label: Challan Number
        type: string
        source: ch
        total: false
      - name: name
        label: Name
        type: string
        source: ch
        total: false
      - name: mobilenumber
        label: Mobile Number
        type: string
        source: ch
        total: false
      - name: businessservice
        label: Business Service
        type: string
        source: ch
        total: false
      - name: applicationstatus
        label: Application Status
        type: string
        source: ch
        total: false
      - name: receiptnumber
        label: Receipt Number
        type: string
        source: ch
        total: false
      - name: challanstatus
        label: Challan Status
        type: string
        source: ch
        total: false
      - name: offence_type_name
        label: Offence Type Name
        type: string
        source: ch
        total: false
      - name: offence_category_name
        label: Offence Category Name
        type: string
        source: ch
        total: false
      - name: offence_subcategory_name
        label: Offence Subcategory Name
        type: string
        source: ch
        total: false
      - name: challan_amount
        label: Challan Amount
        type: string
        source: ch
        total: true
      - name: tenantid
        label: Tenantid
        type: string
        source: ch
        total: false
    searchParams:
      - name: fromDate
        label: From Date
        type: epoch
        source: ch
        isMandatory: false
        searchClause: AND c.createdtime>= $fromDate
      - name: toDate
        label: To Date
        type: epoch
        source: ch
        isMandatory: false
        searchClause: AND c.createdtime <= $toDate
      - name: offence_category_name
        label: Offence Category Name
        type: singlevaluelist
        pattern: list://Solid Waste Management:Solid Waste Management
        source: ch
        isMandatory: false
        searchClause: AND c.offence_category_name = $offence_category_name
      - name: offence_subcategory_name
        label: Offence Subcategory Name
        type: singlevaluelist
        pattern: list://Littering of Waste:Littering of Waste,Open Defecation:Open
          Defecation,Plastic:Plastic,Burning of Waste:Burning of Waste
        source: ch
        isMandatory: false
        searchClause: AND c.offence_subcategory_name = $offence_subcategory_name
      - name: challanstatus
        label: Challan Status
        type: singlevaluelist
        pattern: list://CHALLAN_GENERATED:Challan Generated,CLOSURE:Closed,PENDING_FOR_SETTLEMENT:Pending for Settlement
        source: ch
        isMandatory: false
        searchClause: AND c.challanstatus = $challanstatus
    query: >
      SELECT c.challanno , c.businessservice , c.applicationstatus , c.receiptnumber ,
         c.challanstatus , c.offence_type_name , c.offence_category_name , c.offence_subcategory_name , 
         c.challan_amount , c.tenantid , ca.addressline1 , u.name , u.mobilenumber 
         from eg_challan c
         LEFT JOIN eg_challanaddress ca on ca.challanid = c.id
         LEFT JOIN eg_user u on u.uuid = c.accountid
         WHERE 1=1

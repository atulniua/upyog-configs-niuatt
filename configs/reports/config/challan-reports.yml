  - reportName: ChallanDefaulterReport
    decryptionPathId: CHALLANREPORTS
    summary: Details of user who doesnt pay his challan within 10 days till now.
    version: 1.0.0
    moduleName: rainmaker-ch
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: tenantid
        label: Tenant Id
        type: string
        source: ch
        total: false
      - name: challanno
        label: Challan Number
        type: string
        source: ch
        total: false
      - name: name
        label: Name
        type: string
        source: ch
        total: false
      - name: mobilenumber
        label: Mobile Number
        type: string
        source: ch
        total: false
      - name: businessservice
        label: Business Service
        type: string
        source: ch
        total: false
      - name: applicationstatus
        label: Application Status
        type: string
        source: ch
        total: false
      - name: offence_type_name
        label: Offence Type Name
        type: string
        source: ch
        total: false
      - name: offence_category_name
        label: Offence Category Name
        type: string
        source: ch
        total: false
      - name: offence_subcategory_name
        label: Offence Subcategory Name
        type: string
        source: ch
        total: false
      - name: pending_days
        label: Pending Days
        type: string
        source: ch
        total: false
      - name: challan_date
        label: Challan Date
        type: string
        source: ch
        total: false
      - name: defaulter_status
        label: Defaulter Status
        type: string
        source: ch
        total: false
    searchParams:
      - name: fromDate
        label: From Date
        type: epoch
        source: ch
        isMandatory: false
        searchClause: AND c.createdtime>= $fromDate
      - name: toDate
        label: To Date
        type: epoch
        source: ch
        isMandatory: false
        searchClause: AND c.createdtime <= $toDate
      - name: offence_category_name
        label: Offence Category Name
        type: singlevaluelist
        pattern: list://Solid Waste Management:Solid Waste Management
        source: ch
        isMandatory: false
        searchClause: AND c.offence_category_name = $offence_category_name
      - name: offence_subcategory_name
        label: Offence Subcategory Name
        type: singlevaluelist
        pattern: list://Littering of Waste:Littering of Waste,Open Defecation:Open Defecation,Plastic:Plastic,Burning of Waste:Burning of Waste
        source: ch
        isMandatory: false
        searchClause: AND c.offence_subcategory_name = $offence_subcategory_name
    query: >
      WITH paid_challans AS (
        SELECT DISTINCT
           bill.consumercode AS challanno
           FROM egcl_paymentdetail pd
           JOIN egcl_payment p ON pd.paymentid = p.id
           JOIN egcl_bill bill ON bill.id = pd.billid
           WHERE pd.businessservice = 'Challan_Generation'
           AND p.paymentstatus != 'CANCELLED'
      ),
      defaulter_challans AS (
        SELECT
         c.challanno,c.createdtime,c.applicationstatus, c.offence_type_name,
         c.offence_category_name,c.offence_subcategory_name,u.name AS name,
         u.mobilenumber,c.tenantid,
         FLOOR((EXTRACT(EPOCH FROM NOW()) * 1000 - c.createdtime) / 86400000) AS pending_days
         FROM eg_challan c
         LEFT JOIN eg_challan_citizen cc ON cc.challanid = c.id
         LEFT JOIN eg_user u ON u.uuid = cc.uuid
         LEFT JOIN paid_challans p ON p.challanno = c.challanno
         WHERE c.tenantid = $tenantid
         AND p.challanno IS NULL              
         AND (EXTRACT(EPOCH FROM NOW()) * 1000 - c.createdtime) > (10 * 86400000)             
       )
      SELECT
        'Challan' as businessservice, split_part(tenantid, '.', 2) AS tenantid,
         challanno, name, mobilenumber, applicationstatus, offence_category_name,
         offence_subcategory_name, offence_type_name, pending_days,
         TO_CHAR( TO_TIMESTAMP(createdtime / 1000),'DD-MM-YYYY' ) AS challan_date,
        'DEFAULTER' AS defaulter_status
        FROM defaulter_challans
        WHERE 1=1
    orderby: ORDER BY pending_days DESC
